services:
  # Production : build Vite + nginx. http://localhost:8081
  portfolio:
    build:
      context: .
      target: runtime
      args:
        # adresse de l'API vue par le NAVIGATEUR du visiteur (pas par le conteneur)
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: city-portfolio:latest
    container_name: city-portfolio
    ports:
      - "8081:80"
    restart: unless-stopped

  # Développement : serveur Vite avec rechargement à chaud.
  # docker compose up dev   ->   http://localhost:5174
  dev:
    image: node:22-alpine
    container_name: city-portfolio-dev
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
